name: Docs CI

on:
  pull_request:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.11'

    - name: Build Docs
      run: uv run --locked --only-group docs make -C docsrc html
